<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#146E64">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Field guidance from the Climate Vulnerability and Resilience Assessment Toolkit for tuna fishing communities.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resilience Toolkit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}</style>
<title>Resilience Assessment Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: fixed chapter rail on desktop (drawer on phones), wave-topped chapter bands, card-based guides beside a verbatim full-text mode. Light only by design. */
:root{
  --navy:#0C465B; --deep:#146E64; --teal:#27AD9C; --gold:#F6AE2D; --ocean:#5CA1B9; --orange:#E88C33; --mist:#C8D1D9;
  --bg:#F4F8F7; --card:#FFFFFF; --ink:#103649; --muted:#44606A; --line:#DCE6E5; --soft:#EAF3F1; --alert:#B5441B; --alert-soft:#FBEDE6;
  --display:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body:"Open Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --rail:288px; --c:var(--deep); --c-soft:#E3F1EE;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:100%}
html.big{font-size:132%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--deep)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;box-shadow:0 0 0 6px var(--gold);border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Rail ---------- */
.rail{position:fixed;top:0;bottom:0;left:0;width:var(--rail);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 14px;text-decoration:none;color:var(--ink)}
.brand .mark{width:42px;height:42px;border-radius:12px;background:var(--deep);display:grid;place-items:center;color:#fff;flex:none}
.brand b{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1;letter-spacing:.02em;display:block;margin:2px 0}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.searchbtn{margin:0 16px 10px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:.92rem;background:var(--bg)}
.searchbtn:hover{border-color:var(--teal)}
.navlist{flex:1;overflow-y:auto;padding:6px 10px 14px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;font-size:.9rem;line-height:1.3;color:var(--ink)}
.navitem:hover{background:var(--bg)}
.navitem[aria-current="page"]{background:var(--soft);font-weight:700}
.navitem .num{font-family:var(--display);font-size:1.15rem;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none;line-height:1}
.navsep{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.railfoot{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
.railfoot .pill{font-size:.9rem;min-height:40px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;background:var(--card)}
.pill[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Top bar (phones) ---------- */
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.topbar .t{flex:1;min-width:0;font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(12,70,91,.38);z-index:39}

/* ---------- Main ---------- */
main{margin-left:var(--rail);min-height:100vh;padding-bottom:48px}
.riskbtn{display:flex;align-items:center;gap:10px;margin:4px 16px 12px;background:var(--alert);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;font-size:.92rem;line-height:1.25;text-align:left}
.riskbtn:hover{background:#9A3815}
.askbtn{background:var(--deep);margin-bottom:6px}.askbtn:hover{background:#0F5A52}
.topbar .risktop.asktop{background:var(--deep)}.topbar .asktop[hidden]{display:none}
.askin{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:1.02rem;margin-top:4px;background:#fff}
.askq{display:block;width:100%;text-align:left;margin-top:8px;background:var(--c-soft);border-radius:0 12px 12px 0;padding:10px 12px 10px 14px}
.askq small{display:block;margin-top:6px;font-size:.8rem;font-weight:700;color:var(--c)}
.topbar .risktop{background:var(--alert);color:#fff;width:auto;padding:0 12px 0 10px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* ---------- Home hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFFFFF 0%,#F1F8F6 100%);border-bottom:1px solid var(--line)}
.hero .wrap{position:relative;z-index:2;padding-block:56px 150px}
.eyebrow{font-size:.78rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--deep)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.9rem,6.4vw,5.4rem);line-height:.92;letter-spacing:.005em;color:var(--navy);margin:12px 0 18px;max-width:13.5em}
.hero h1 em{font-style:normal;color:var(--deep)}
.hero p.lead{font-size:1.12rem;color:var(--muted);max-width:38em}
.waves{position:absolute;left:0;right:0;bottom:0;height:150px;z-index:1;pointer-events:none}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.waves .w1{animation:drift 26s linear infinite}
.waves .w2{animation:drift 38s linear infinite reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- Variant bar ---------- */
.vbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:14px;padding:8px 8px 8px 16px;margin:20px 0 4px}
.vbar .lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#BFE0EA;margin-right:auto}
.vbar button{border-radius:10px;padding:8px 12px;font-size:.86rem;font-weight:600;color:#DDEFF4;display:flex;gap:6px;align-items:center}
.vbar button b{font-family:var(--display);font-weight:400;font-size:1.1rem;line-height:1;background:rgba(255,255,255,.14);width:22px;height:22px;border-radius:6px;display:grid;place-items:center}
.vbar button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.vbar button[aria-pressed="true"] b{background:var(--gold);color:var(--navy)}
.vbar.hide{display:none}

/* ---------- Home A: tiles ---------- */
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sech h2{font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:.01em;color:var(--navy);line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:168px;transition:transform .18s, box-shadow .18s, border-color .18s;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(12,70,91,.45);border-color:var(--c)}
.tile .pic{width:58px;height:58px;border-radius:16px;background:var(--c-soft);color:var(--c);display:grid;place-items:center}
.tile .pic svg.i{width:32px;height:32px;stroke-width:1.7}
.tile b{font-size:1.04rem;line-height:1.3;font-weight:700}
.tile .src{margin-top:auto;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--c)}
.tile.urgent{background:var(--alert-soft);border-color:#EFC9B9;--c:var(--alert);--c-soft:#F7DACD}

/* ---------- Home B: handbook ---------- */
.book{display:grid;gap:12px}
.chap{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:18px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;transition:border-color .18s, box-shadow .18s;width:100%}
.chap:hover{border-color:var(--c);box-shadow:0 12px 26px -20px rgba(12,70,91,.5)}
.chap .n{font-family:var(--display);font-size:3.4rem;line-height:.8;color:var(--c);text-align:center}
.chap h3{font-size:1.05rem;line-height:1.35}
.chap .chips{margin-top:8px}
.chap .go{width:40px;height:40px;border-radius:50%;background:var(--c-soft);color:var(--c);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:10px;font-size:.875rem;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;line-height:1.5}
button.chip{min-height:44px;padding:8px 14px}
button.chip:hover{border-color:var(--c);color:var(--c)}

/* ---------- Home C: journey ---------- */
.journey{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;margin-bottom:16px;overflow:hidden}
.journey h3{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.01em;color:var(--navy);line-height:1}
.journey .sub{font-size:.85rem;color:var(--muted);margin-top:4px}
.track{position:relative;margin:22px 0 6px;overflow-x:auto;padding-bottom:4px}
.track-in{position:relative;min-width:640px;height:150px}
.vlist{display:none}
.track svg.sea{position:absolute;left:0;right:0;top:46px;width:100%;height:40px}
.stop{position:absolute;top:30px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:130px;text-align:center}
.stop .dot{width:46px;height:46px;border-radius:50%;background:var(--card);border:3px solid var(--mist);display:grid;place-items:center;color:var(--muted);transition:all .2s}
.stop .lbl{font-size:.8rem;font-weight:600;line-height:1.25;color:var(--muted)}
.stop[aria-pressed="true"] .dot{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.1)}
.stop[aria-pressed="true"] .lbl{color:var(--ink)}
.boat{position:absolute;top:0;width:44px;height:30px;transform:translateX(-50%);transition:left .6s cubic-bezier(.4,.1,.2,1);color:var(--navy)}
.stopbody{border-top:1px dashed var(--line);padding-top:16px;margin-top:6px}

/* ---------- Chapter header ---------- */
.chead{position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#E6F3F0 100%);color:var(--navy);overflow:hidden;border-bottom:1px solid var(--line)}
.chead .wrap{position:relative;z-index:2;padding-block:34px 66px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:end}
.chead .big{font-family:var(--display);font-size:clamp(5rem,12vw,8.5rem);line-height:.75;color:transparent;-webkit-text-stroke:2px #27AD9C}
.chead .big.ic{-webkit-text-stroke:0;color:#27AD9C}
.chead .big.ic svg.i{width:88px;height:88px;stroke-width:1.4}
.chead .kick{font-size:.875rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--deep)}
.chead h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.4vw,3.3rem);line-height:.98;letter-spacing:.01em;margin-top:6px}
.chead .wv{position:absolute;left:0;right:0;bottom:-1px;height:44px;z-index:1}
.modes{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;width:max-content;max-width:100%;margin:-28px 0 0;position:relative;z-index:3;box-shadow:0 10px 24px -18px rgba(12,70,91,.5)}
.modes button{border-radius:10px;padding:9px 18px;min-height:44px;font-weight:700;font-size:.92rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.modes button[aria-pressed="true"]{background:var(--c);color:#fff}

/* ---------- Generic guide parts ---------- */
.gsec{margin-top:32px}
.gh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.gh .say{margin-left:auto}
.gh h2.long,.chead h1.long{font-family:var(--body);font-weight:700;letter-spacing:0;line-height:1.2}
.gh h2.long{font-size:1.3rem}
.chead h1.long{font-size:clamp(1.4rem,3vw,2rem)}
.gh .tag{font-family:var(--display);font-size:1.25rem;width:36px;height:36px;border-radius:10px;background:var(--c-soft);color:var(--c);display:grid;place-items:center;line-height:1;flex:none}
.gh h2{font-family:var(--display);font-weight:400;font-size:1.85rem;line-height:1;letter-spacing:.01em;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lead2{font-size:1.06rem;color:var(--ink);max-width:46em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.ilist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ilist li .b.none{background:none}
.reading{background:#FFF0C7!important;box-shadow:0 0 0 3px #F6AE2D;border-radius:10px;transition:background .2s}
.ilist li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;line-height:1.4}
.ilist li .b{width:44px;height:44px;border-radius:12px;background:var(--c-soft);color:var(--c);display:grid;place-items:center}
.ilist li.sub{margin-left:56px;grid-template-columns:36px minmax(0,1fr);background:var(--bg);padding:8px 12px 8px 8px}
.ilist li.sub .b{width:36px;height:36px;border-radius:10px}
.ilist li.lab{display:block;background:none;border:0;padding:10px 2px 0;font-weight:700;color:var(--c);font-size:.9rem;letter-spacing:.02em}
.ilist li.para{display:block;line-height:1.6}
.say{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--line);background:var(--card);flex:none}
.say svg.i{width:18px;height:18px}
.say:hover{border-color:var(--c)}
.say.on{background:var(--c);color:#fff;border-color:var(--c)}
.nosay .say{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 6px;margin-top:24px}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:.88rem;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button b{font-family:var(--display);font-weight:400;font-size:1.05rem;line-height:1;color:var(--c)}
.tabs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tabs button[aria-pressed="true"] b{color:#fff}
.quote{border-left:4px solid var(--c);padding:6px 0 6px 16px;font-size:1.04rem;color:var(--ink)}
.callout{display:flex;gap:12px;align-items:flex-start;background:var(--c-soft);border-radius:14px;padding:14px 16px}
.callout svg.i{color:var(--c);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--gold);color:var(--navy);min-height:48px}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.btn.c{background:var(--c);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fact{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.fact .b{width:50px;height:50px;border-radius:14px;background:var(--c-soft);color:var(--c);display:grid;place-items:center;flex:none}
.fact b{display:block;font-size:1.02rem;line-height:1.3}
.sublist{margin:6px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted);line-height:1.4}.sublist li{margin-top:2px}
.fact[aria-expanded="true"]{border-color:var(--c)}
.fact .more{margin-top:8px;font-size:.93rem;color:var(--ink)}

/* ---------- Venn ---------- */
.venn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
.venn svg{width:100%;max-width:420px;display:block;margin:0 auto}
.venn circle{cursor:pointer;transition:fill-opacity .2s}
.venn text{font-family:var(--display);font-size:22px;letter-spacing:.02em;pointer-events:none}

/* ---------- Stepper / deck ---------- */
.deckwrap{position:relative}
.deck{display:grid;grid-auto-flow:column;grid-auto-columns:100%;align-items:start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:16px;scrollbar-width:none;padding-bottom:4px;transition:height .25s}
.deck::-webkit-scrollbar{display:none}
.deck>.slide{min-height:min(58vh,520px)}
[id^="deck-"]{scroll-margin-top:150px}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.letters button{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-family:var(--display);font-size:1.25rem;color:var(--navy)}
.letters button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.slide{scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:14px}
.slide .top{display:flex;align-items:center;gap:16px}
.slide .pic{width:72px;height:72px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.slide .pic svg.i{width:40px;height:40px;stroke-width:1.6}
.slide .k{font-family:var(--display);font-size:1.1rem;color:var(--c);letter-spacing:.04em}
.slide h3{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1;color:var(--navy)}
.decknav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:10px;height:10px;border-radius:50%;background:var(--mist)}
.dots button[aria-current="true"]{background:var(--c);width:26px;border-radius:6px}
.round{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.round:hover{border-color:var(--c);color:var(--c)}
.round[disabled]{opacity:.35}

/* ---------- Checklist ---------- */
.ck{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.4;min-height:58px}
.ck .bx{width:30px;height:30px;border-radius:9px;border:2px solid #52707A;display:grid;place-items:center;flex:none;color:#fff;transition:all .15s}
.ck .ic2{color:var(--c);display:grid;place-items:center}
.ck span.tx{flex:1;min-width:0}
.ck[aria-checked="true"]{border-color:var(--c);background:var(--c-soft)}
.ck[aria-checked="true"] .bx{background:var(--c);border-color:var(--c)}
.cklist{display:grid;gap:8px}

/* One reading engine for every play button. Text is spoken sentence by sentence (long single utterances fail on Android);
   a generation counter stops stale callbacks from a cancelled reading from advancing a new one. */
var RG=0,VOICE=null,RATE=LS.get("tk-slow",false)?.62:.9,REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function pickVoice(){if(!TTS)return;var vs=[];try{vs=speechSynthesis.getVoices()||[]}catch(e){}VOICE=first(vs,function(v){return /^en[-_]GB/i.test(v.lang)})||first(vs,function(v){return /^en/i.test(v.lang)})||null;return vs.length}
if(TTS){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){}}
function cleanSpeech(t){return String(t).replace(/☐|\[ \]/g," ").replace(/_{3,}/g," ").replace(/\s*\|\s*/g,", ").replace(/\s+/g," ").trim()}
function chunks(t){var out=[],cur="";sentences(cleanSpeech(t)).forEach(function(s){s=s.trim();while(s.length>220){var k=s.lastIndexOf(", ",220);if(k<60)k=s.lastIndexOf(" ",220);out.push(s.slice(0,k+1));s=s.slice(k+1).trim()}if((cur+" "+s).length>220&&cur){out.push(cur);cur=s}else cur=(cur?cur+" ":"")+s});if(cur)out.push(cur);return out}
function playBtn(){return TTS?'<button class="say play" data-a="play" aria-label="Read aloud" title="Read aloud">'+I("speaker")+'</button>':""}
function sayBtn(text){if(!TTS||!text)return "";var id="s"+(++sayN);SAY[id]=text;return '<button class="say" data-a="say" data-v="'+id+'" aria-label="Read aloud" title="Read aloud">'+I("speaker")+'</button>'}
function stopSpeak(){RG++;if(TTS){try{speechSynthesis.cancel()}catch(e){}}document.querySelectorAll(".reading").forEach(function(e){e.classList.remove("reading")});document.querySelectorAll(".say.on").forEach(function(b){b.classList.remove("on");b.innerHTML=I("speaker")});document.querySelectorAll("[data-a=readalong].on").forEach(function(b){b.classList.remove("on");b.innerHTML=I("play")+"Read aloud"})}
function sayChunks(text,gen,done){var parts=chunks(text),k=0;(function nx(){if(gen!==RG)return;if(k>=parts.length){done();return}
 var u=new SpeechSynthesisUtterance(parts[k++]);u.lang=VOICE?VOICE.lang:"en-GB";if(VOICE)u.voice=VOICE;u.rate=RATE;
 u.onend=function(){if(gen===RG)nx()};u.onerror=function(ev){if(gen===RG&&ev&&ev.error!=="interrupted"&&ev.error!=="canceled")stopSpeak()};
 try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){}})()}

function readItems(list,from,btn){
 if(!TTS)return;if(btn&&btn.classList.contains("on")){stopSpeak();return}
 stopSpeak();if(pickVoice()>0&&!VOICE)toast("No English voice is installed on this device");
 var gen=++RG;if(btn){btn.classList.add("on");if(btn.dataset.a==="readalong")btn.innerHTML=I("stop")+"Stop";else btn.innerHTML=I("stop")}
 var i=from||0;
 setTimeout(function step(){if(gen!==RG)return;
  list.forEach(function(it){if(it.el)it.el.classList.remove("reading")});
  if(i>=list.length){stopSpeak();return}
  var it=list[i];if(it.el){it.el.classList.add("reading");var r=it.el.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight-90){try{it.el.scrollIntoView({block:"center",behavior:REDUCED?"auto":"smooth"})}catch(e){}}}
  sayChunks(it.text,gen,function(){i++;step()})},70)}
